[items]
[[items]]
name = "Environment variables"
type = "ini"
glob = [
    "**/.env*",
]

[[items]]
name = "Generic files named secret"
type = "any"
glob = [
    "**/secret*",
]

[[items]]
name = "Generic files named credential"
type = "any"
glob = [
    "**/credential*",
]

[[items]]
name = "Generic JSON config"
type = "json"
glob = [
    "**/config.json",
    "**/settings.json",
]

[[items]]
name = "PHP Files with secrets"
type = "php"
glob = [
    "**/config.php",
    "**/configuration.php",
    "**/settings.php",
]

[[items]]
name = "WordPress"
type = "php"
glob = [
    "**/wp-config.php",
]

[[items]]
name = "MediaWiki"
type = "php"
glob = [
    "**/LocalSettings.php",
]

[[items]]
name = ".NET"
type = "json"
glob = [
    "**/appsettings.json",
    "**/appsettings.*.json",
]

[[items]]
name = "IIS/.NET connection strings"
type = "xml"
glob = [
    "**/web.config",
    "**/app.config",
    "**/machine.config",
]

[[items]]
name = "Ruby on Rails"
type = "any"
glob = [
    "**/database.yml",
    "**/secrets.yml",
    "**/master.key",
    "**/credentials.yml.enc",
]

[[items]]
name = "Spring"
type = "yaml"
glob = [
    "**/application.properties",
    "**/application.yml",
]

[[items]]
name = "Django"
type = "py"
glob = [
    "**/local_settings.py",
    "**/settings.py",
]

[[items]]
name = "AWS"
type = "ini"
glob = [
    "**/.aws/credentials",
    "**/.aws/config",
]

[[items]]
name = "Azure"
type = "json"
glob = [
    "**/.azure/accessTokens.json",
    "**/.azure/msal_token_cache.json",
]

[[items]]
name = "Google Cloud"
type = "any"
glob = [
    "**/.config/gcloud/credentials.db",
    "**/application_default_credentials.json",
]

[[items]]
name = "Kubernetes"
type = "yaml"
glob = [
    "**/.kube/config",
]

[[items]]
name = "Docker"
type = "json"
glob = [
    "**/.docker/config.json",
]

[[items]]
name = "Terraform"
type = "any"
glob = [
    "**/terraform.tfstate",
    "**/terraform.tfvars",
    "**/*.auto.tfvars",
]

[[items]]
name = "Package manager credentials"
type = "any"
glob = [
    "**/.npmrc",
    "**/.pypirc",
    "**/.gem/credentials",
    "**/.m2/settings.xml",
]

[[items]]
name = "SSH keys"
type = "custom"
glob = [
    "**/.ssh/id_rsa*",
    "**/.ssh/id_ed25519*",
    "**/.ssh/id_ecdsa*",
    "**/.ssh/authorized_keys",
    "**/.ssh/known_hosts",
]

[[items]]
name = "Keys and certificates"
type = "any"
glob = [
    "**/*.pem",
    "**/*.key",
    "**/*.ppk",
    "**/*.pfx",
    "**/*.p12",
    "**/*.jks",
    "**/*.keystore",
]

[[items]]
name = "OpenVPN"
type = "custom"
glob = [
    "**/*.ovpn",
]

[[items]]
name = "Git"
type = "ini"
glob = [
    "**/.git/config",
    "**/.git-credentials",
    "**/.gitconfig",
]

[[items]]
name = "Netrc"
type = "custom"
glob = [
    "**/.netrc",
    "**/_netrc",
]

[[items]]
name = "Htpasswd"
type = "custom"
glob = [
    "**/.htpasswd",
]

[[items]]
name = "Shell and REPL history"
type = "txt"
glob = [
    "**/.bash_history",
    "**/.zsh_history",
    "**/.mysql_history",
    "**/.psql_history",
    "**/.python_history",
    "**/.viminfo",
    "**/PSReadLine/ConsoleHost_history.txt",
]

[[items]]
name = "Docker Compose and Dockerfile"
type = "yaml"
glob = [
    "**/docker-compose.yml",
    "**/Dockerfile",
]

[[items]]
name = "CI pipelines"
type = "yaml"
glob = [
    "**/.gitlab-ci.yml",
    "**/.github/workflows/*.yml",
    "**/Jenkinsfile",
]

[[items]]
name = "Jenkins"
type = "any"
glob = [
    "**/credentials.xml",
    "**/secrets/master.key",
    "**/secrets/hudson.util.Secret",
]

[[items]]
name = "Linux password files"
type = "custom"
glob = [
    "**/etc/shadow",
    "**/etc/passwd",
    "**/etc/security/opasswd",
]

[[items]]
name = "Mounts and Samba"
type = "ini"
glob = [
    "**/etc/fstab",
    "**/etc/samba/smb.conf",
    "**/.smbcredentials",
]

[[items]]
name = "Kerberos"
type = "any"
glob = [
    "**/etc/krb5.keytab",
    "**/tmp/krb5cc_*",
]

[[items]]
name = "Database credentials"
type = "any"
glob = [
    "**/mysql/mysql/user.MYD",
    "**/etc/mysql/debian.cnf",
    "**/.my.cnf",
    "**/.pgpass",
]

[[items]]
name = "Backup and swap files"
type = "any"
glob = [
    "**/*.bak",
    "**/*.old",
    "**/*.orig",
    "**/*.swp",
    "**/*~",
]

[[items]]
name = "KeePass"
type = "any"
glob = [
    "**/*.kdbx",
]

[[items]]
name = "FileZilla"
type = "xml"
glob = [
    "**/sitemanager.xml",
    "**/recentservers.xml",
]

[[items]]
name = "mRemoteNG"
type = "xml"
glob = [
    "**/confCons.xml",
]

[[items]]
name = "Browser saved logins"
type = "any"
glob = [
    "**/Login Data",
    "**/logins.json",
    "**/key4.db",
]

