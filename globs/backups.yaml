file: backups.yaml
description: Backup copies and archives that may keep credentials removed from the live files
author: Richard A. Dubniczky
items:

- name: "Backup copies"
  type: any
  glob:
  - "**/*.bak"
  - "**/*.bk"
  - "**/*.bkp"
  - "**/*.backup"
  - "**/*.old"
  - "**/*.orig"
  - "**/*.save"
  - "**/*.sav"
  - "**/*.copy"
  - "**/*.prev"

- name: "Files and folders named backup"
  type: any
  glob:
  - "**/backup*"
  - "**/Backup*"
  - "**/*_backup*"
  - "**/*-backup*"

- name: "Editor swap and backup files"
  type: any
  glob:
  - "**/*~"
  - "**/*.swp"
  - "**/*.swo"
  - "**/*.un~"
  - "**/#*#"

- name: "Database dumps"
  type: any
  glob:
  - "**/*.sql"
  - "**/*.sql.gz"
  - "**/*.dump"

- name: "Zip archives"
  type: zip
  glob:
  - "**/*.zip"
  - "**/*.7z"
  - "**/*.rar"

- name: "Tar archives"
  type: tar
  glob:
  - "**/*.tar"
  - "**/*.tar.gz"
  - "**/*.tgz"
  - "**/*.tar.bz2"
  - "**/*.tbz2"
  - "**/*.tar.xz"
  - "**/*.txz"
  - "**/*.tar.zst"

- name: "Compressed files"
  type: any
  glob:
  - "**/*.gz"
  - "**/*.bz2"
  - "**/*.xz"
  - "**/*.zst"
